[build-system]
requires = [
  "scikit-build-core>=0.10",
  "pybind11",
]
build-backend = "scikit_build_core.build"

[project]
name = "OpenSceneGraph"
version = "1.0.0"
description = "And Python binding interface to OpenSceneGraph"
# readme = "README.md"
requires-python = ">=3.10"
# license = { file = "LICENSE" }
classifiers = [
  "Programming Language :: Python :: 3",
]
dependencies = ["numpy"]

[tool.wheel]
exclude = [
  "dist*",
  "tests*",
]

[tool.scikit-build]
cmake.build-type = "Release"

[tool.scikit-build.cmake.define]
PYOSG_ENABLE_TEST = false
